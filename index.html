<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελληνικά Προξενεία στη Γερμανία</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; color: #222; }
  header { background: #003476; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  header div h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.01em; }
  header div p { font-size: 0.82rem; opacity: 0.85; margin-top: 2px; }
  .container { display: flex; height: calc(100vh - 80px); }
  .sidebar { width: 320px; min-width: 280px; background: white; padding: 20px; overflow-y: auto; box-shadow: 2px 0 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 16px; z-index: 10; }
  .search-box label { display: block; font-size: 0.78rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .search-row { display: flex; gap: 8px; }
  .search-row input { flex: 1; padding: 10px 12px; border: 2px solid #dde1ea; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
  .search-row input:focus { border-color: #003476; }
  .search-row button { padding: 10px 16px; background: #003476; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: background 0.2s; }
  .search-row button:hover { background: #0055aa; }
  .result-card { display: none; background: #f0f4ff; border-left: 4px solid #003476; border-radius: 8px; padding: 14px 16px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
  .result-card.visible { display: block; }
  .result-card .consulate-name { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: #003476; }
  .result-card .detail { font-size: 0.88rem; color: #444; margin-bottom: 4px; display: flex; gap: 8px; align-items: flex-start; }
  .error-msg { display: none; background: #fff0f0; border-left: 4px solid #e53935; border-radius: 8px; padding: 12px 14px; font-size: 0.9rem; color: #c62828; }
  .error-msg.visible { display: block; }
  .legend { margin-top: auto; padding-top: 16px; border-top: 1px solid #eee; }
  .legend h3 { font-size: 0.78rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; margin-bottom: 7px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background 0.15s; }
  .legend-item:hover { background: #f0f4ff; }
  .legend-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; opacity: 0.85; }
  #map { flex: 1; z-index: 1; background: #e8ecf0; }
  .consulate-tooltip { background: rgba(0,52,118,0.92); color: white; border: none; border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.25); white-space: nowrap; }
  .consulate-tooltip::before { border-top-color: rgba(0,52,118,0.92); }
  #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; gap: 16px; font-family: 'Segoe UI', Arial, sans-serif; }
  #loading p { color: #003476; font-size: 1rem; font-weight: 600; }
  .spinner { width: 40px; height: 40px; border: 4px solid #dde1ea; border-top-color: #003476; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; height: auto; max-height: 45vh; } #map { height: 55vh; } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Φόρτωση χάρτη...</p>
</div>

<header>
  <div>
    <h1>Ελληνικά Προξενεία στη Γερμανία</h1>
    <p>Εύρεση αρμόδιου προξενείου βάσει Ταχυδρομικού Κωδικού</p>
  </div>
</header>

<div class="container">
  <div class="sidebar">
    <div class="search-box">
      <label>Εισάγετε τον Ταχυδρομικό σας Κωδικό</label>
      <div class="search-row">
        <input type="text" id="plzInput" placeholder="π.χ. 10115" maxlength="5" inputmode="numeric"/>
        <button onclick="searchPLZ()">&#128269;</button>
      </div>
    </div>

    <button onclick="resetMap()" style="background:#f5f6fa; border:2px solid #dde1ea; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:0.88rem; color:#555; text-align:left; width:100%;">↺ Επαναφορά χάρτη</button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-card" id="resultCard">
      <div class="consulate-name" id="resultName"></div>
      <div class="detail"><span>📍</span><span id="resultAddress"></span></div>
      <div class="detail"><span>📞</span><span id="resultPhone"></span></div>
    </div>

    <div class="legend">
      <h3>Περιοχές ευθύνης</h3>
      <div class="legend-item" onclick="highlightConsulate('Βερολίνο')"><div class="legend-dot" style="background:#1a73e8"></div><span>Πρεσβεία Βερολίνου</span></div>
      <div class="legend-item" onclick="highlightConsulate('Αμβούργο')"><div class="legend-dot" style="background:#e53935"></div><span>Γενικό Προξενείο Αμβούργου</span></div>
      <div class="legend-item" onclick="highlightConsulate('Ντύσσελντορφ')"><div class="legend-dot" style="background:#43a047"></div><span>Γενικό Προξενείο Ντύσσελντορφ</span></div>
      <div class="legend-item" onclick="highlightConsulate('Φραγκφούρτη')"><div class="legend-dot" style="background:#fb8c00"></div><span>Γενικό Προξενείο Φραγκφούρτης</span></div>
      <div class="legend-item" onclick="highlightConsulate('Στουτγάρδη')"><div class="legend-dot" style="background:#8e24aa"></div><span>Γενικό Προξενείο Στουτγάρδης</span></div>
      <div class="legend-item" onclick="highlightConsulate('Μόναχο')"><div class="legend-dot" style="background:#00897b"></div><span>Γενικό Προξενείο Μονάχου</span></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script>
const consulateInfo = {
  "Βερολίνο": { "full": "Πρεσβεία της Ελλάδος στο Βερολίνο", "address": "Hiroshimastr. 11-15, 10785 Berlin", "phone": "+49 30 2083870", "color": "#1a73e8" },
  "Αμβούργο": { "full": "Γενικό Προξενείο Αμβούργου", "address": "Neue ABC Str. 10, 20354 Hamburg", "phone": "+49 40 4132430", "color": "#e53935" },
  "Ντύσσελντορφ": { "full": "Γενικό Προξενείο Ντύσσελντορφ", "address": "Willi Becker Allee 11, 40227 Düsseldorf", "phone": "+49 211 6878500", "color": "#43a047" },
  "Φραγκφούρτη": { "full": "Γενικό Προξενείο Φραγκφούρτης", "address": "Zeppelinallee 43, 60325 Frankfurt am Main", "phone": "+49 69 9799120", "color": "#fb8c00" },
  "Στουτγάρδη": { "full": "Γενικό Προξενείο Στουτγάρδης", "address": "Leuschnerstr. 12 (2ος όροφος), 70174 Stuttgart", "phone": "+49 711 222 987 14-88", "color": "#8e24aa" },
  "Μόναχο": { "full": "Γενικό Προξενείο Μονάχου", "address": "Möhlstr. 22, 81675 München", "phone": "+49 89 9988670", "color": "#00897b" }
};

const map = L.map('map', { center: [51.1657, 10.4515], zoom: 6, minZoom: 4, maxZoom: 19 });

let geojsonLayer;
let highlightedLayer = null;

const tooltip = L.tooltip({ permanent: false, direction: 'top', className: 'consulate-tooltip' });

function getColor(consulate) {
  return consulateInfo[consulate] ? consulateInfo[consulate].color : '#999';
}

function style(feature) {
  return { fillColor: getColor(feature.properties.consulate), fillOpacity: 0.45, color: 'white', weight: 1.5 };
}

// Load both GeoJSON files
Promise.all([
  fetch('plz.geojson').then(r => r.json()),
  fetch('bundeslaender.geojson').then(r => r.json())
]).then(([plzData, blData]) => {

  geojsonLayer = L.geoJSON(plzData, { style: style }).addTo(map);

  L.geoJSON(blData, {
    style: { fillOpacity: 0, color: 'transparent', weight: 0 },
    onEachFeature: function(feature, layer) {
      layer.on({
        mouseover: function(e) { tooltip.setContent(feature.properties.name); tooltip.setLatLng(e.latlng); tooltip.addTo(map); },
        mousemove: function(e) { tooltip.setLatLng(e.latlng); },
        mouseout: function() { tooltip.remove(); }
      });
    }
  }).addTo(map);

  document.getElementById('loading').style.display = 'none';

}).catch(err => {
  console.error('Error loading data:', err);
  document.getElementById('loading').innerHTML = '<p style="color:red">Σφάλμα φόρτωσης δεδομένων.</p>';
});

function showResult(plz2, zoomToLayer) {
  const resultCard = document.getElementById('resultCard');
  const errorMsg = document.getElementById('errorMsg');
  let foundConsulate = null;
  if (!geojsonLayer) return;
  geojsonLayer.eachLayer(layer => { if (layer.feature.properties.plz === plz2) foundConsulate = layer.feature.properties.consulate; });
  if (!foundConsulate || foundConsulate === 'Άγνωστο') { errorMsg.classList.add('visible'); resultCard.classList.remove('visible'); return; }
  errorMsg.classList.remove('visible');
  const info = consulateInfo[foundConsulate];
  document.getElementById('resultName').textContent = info.full;
  document.getElementById('resultAddress').textContent = info.address;
  document.getElementById('resultPhone').textContent = info.phone;
  resultCard.style.borderLeftColor = info.color;
  resultCard.classList.add('visible');
  if (highlightedLayer) { geojsonLayer.resetStyle(highlightedLayer); highlightedLayer = null; }
  let bounds = null;
  geojsonLayer.eachLayer(layer => {
    if (layer.feature.properties.consulate === foundConsulate) {
      layer.setStyle({ fillOpacity: 0.7, weight: 2, color: '#333' });
      const b = layer.getBounds();
      if (!bounds) bounds = b; else bounds.extend(b);
      highlightedLayer = layer;
    } else {
      layer.setStyle({ fillOpacity: 0.2, weight: 1, color: 'white' });
    }
  });
  if (bounds && zoomToLayer) map.fitBounds(bounds, { padding: [30, 30] });
}

function searchPLZ() {
  const input = document.getElementById('plzInput').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const resultCard = document.getElementById('resultCard');
  errorMsg.classList.remove('visible');
  resultCard.classList.remove('visible');
  if (!/^\d{5}$/.test(input)) { errorMsg.textContent = 'Παρακαλώ εισάγετε έναν 5ψήφιο ΤΚ (π.χ. 10115).'; errorMsg.classList.add('visible'); return; }
  if (geojsonLayer) geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
  showResult(input.substring(0, 2), true);
}

function resetMap() {
  map.setView([51.1657, 10.4515], 6);
  if (geojsonLayer) geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
  highlightedLayer = null;
  document.getElementById('plzInput').value = '';
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('errorMsg').classList.remove('visible');
}

function highlightConsulate(consulateName) {
  if (!geojsonLayer) return;
  geojsonLayer.eachLayer(layer => geojsonLayer.resetStyle(layer));
  highlightedLayer = null;
  const resultCard = document.getElementById('resultCard');
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.classList.remove('visible');
  const info = consulateInfo[consulateName];
  document.getElementById('resultName').textContent = info.full;
  document.getElementById('resultAddress').textContent = info.address;
  document.getElementById('resultPhone').textContent = info.phone;
  resultCard.style.borderLeftColor = info.color;
  resultCard.classList.add('visible');
  let bounds = null;
  geojsonLayer.eachLayer(layer => {
    if (layer.feature.properties.consulate === consulateName) {
      layer.setStyle({ fillOpacity: 0.75, weight: 2.5, color: '#333' });
      const b = layer.getBounds(); if (!bounds) bounds = b; else bounds.extend(b);
    } else { layer.setStyle({ fillOpacity: 0.15, weight: 1, color: 'white' }); }
  });
  if (bounds) map.fitBounds(bounds, { padding: [40, 40] });
}

document.getElementById('plzInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') searchPLZ(); });
</script>
</body>
</html>
